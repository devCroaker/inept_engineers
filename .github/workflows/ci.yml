name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Throwaway database for the test run. This container is created for the
      # job, is reachable only on localhost inside the runner, holds nothing but
      # what the tests write, and is destroyed when the job ends. The password
      # below defines that container rather than granting access to anything, so
      # it is not a secret. Real credentials belong in repository secrets and
      # are referenced as ${{ secrets.NAME }}, never written inline here.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inept
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: inept
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U inept -d inept"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://inept:localdev@localhost:5433/inept

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check
