packages:
  - "apps/*"
  - "packages/*"
  - "infra"

# esbuild ships prebuilt platform binaries via a postinstall script.
# Required by drizzle-kit, vite, and CDK Lambda bundling.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@aws-sdk/credential-providers@3.1125.0'
  - '@aws-sdk/rds-signer@3.1125.0'
  - '@aws-sdk/client-sesv2@3.1125.0'
  - '@scalar/client-side-rendering@0.4.1'
  - '@scalar/helpers@0.12.0'
  - '@scalar/hono-api-reference@0.12.2'
  - '@scalar/schemas@0.10.0'
  - '@scalar/types@0.20.0'
